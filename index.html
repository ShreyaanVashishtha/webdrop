<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebDrop - Fast P2P Transfer</title>
    
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    
    <!-- Vercel Speed Insights -->
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; margin: 0; min-height: 100vh; overflow-x: hidden; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
        
        /* Liquid Glass & Background Animations */
        .blob-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden; z-index: -1; pointer-events: none;
            background: #09090b;
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5;
            animation: float 20s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }
        .blob-1 { background: #3b82f6; width: 45vw; height: 45vw; max-width: 500px; max-height: 500px; top: -10%; left: -10%; }
        .blob-2 { background: #8b5cf6; width: 40vw; height: 40vw; max-width: 400px; max-height: 400px; bottom: -20%; right: -10%; animation-delay: -5s; }
        .blob-3 { background: #06b6d4; width: 40vw; height: 40vw; max-width: 450px; max-height: 450px; top: 30%; left: 40%; transform: translate(-50%, -50%); animation-delay: -10s; opacity: 0.3; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* Glassmorphism Panel Class */
        .glass-panel {
            background: rgba(24, 24, 27, 0.45);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @keyframes liquidPulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 25px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        .drag-active {
            border-color: #3b82f6 !important;
            background-color: rgba(59, 130, 246, 0.15) !important;
            animation: liquidPulse 2s infinite;
        }

        /* Toast notifications */
        #toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        
        .toast {
            min-width: 250px; padding: 14px 20px; border-radius: 12px;
            background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1); color: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex; align-items: center; justify-content: space-between;
            pointer-events: auto;
        }
        
        @keyframes slideInRight { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(120%); opacity: 0; } }

        #qrcode img { margin: 0 auto; border-radius: 8px; }
    </style>
</head>

<body class="flex flex-col selection:bg-blue-500/30 bg-transparent">

    <!-- Animated Glass Background -->
    <div class="blob-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Navbar -->
    <header class="px-6 py-4 border-b border-white/5 bg-zinc-950/40 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-blue-600 to-cyan-500 p-2 rounded-xl shadow-lg">
                    <i class="ph-bold ph-paper-plane-tilt text-white text-xl"></i>
                </div>
                <h1 class="text-xl font-bold text-white tracking-tight">WebDrop</h1>
            </div>
            
            <div class="flex items-center space-x-2 px-4 py-2 glass-panel rounded-full text-sm font-medium transition-colors">

                <span class="text-zinc-300 capitalize" id="status-text">Connecting...</span>
            </div>
        </div>
    </header>

    <!-- Main Application Area -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-5xl mx-auto w-full relative z-10">
        
        <!-- ================= SETUP VIEW ================= -->
        <div id="setup-view" class="w-full max-w-md flex flex-col gap-8 slide-up">
            
            <!-- My ID Card -->
            <div class="glass-panel p-8 rounded-[2rem] w-full text-center relative overflow-hidden transition-all duration-500 hover:shadow-[0_0_40px_-10px_rgba(59,130,246,0.2)]">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-cyan-400 to-purple-500"></div>
                <h2 class="text-zinc-400 text-sm font-semibold tracking-widest uppercase mb-4">Your Device PIN</h2>
                
                <div class="text-6xl font-black text-white tracking-widest font-mono mb-6 drop-shadow-lg" id="my-id-display">
                    -----
                </div>

                <div class="bg-white/95 backdrop-blur-md p-3 rounded-2xl w-48 mx-auto mb-6 shadow-xl hidden" id="qr-container">
                    <div id="qrcode"></div>
                </div>
                
                <button onclick="copyInviteLink()" class="w-full bg-white/5 hover:bg-white/10 text-white font-medium py-3 rounded-xl transition-all flex items-center justify-center gap-2 border border-white/10">

            <div class="flex items-center space-x-4 opacity-60">

            <!-- Connect Form -->

        <!-- ================= ACTIVE VIEW ================= -->
        <div id="active-view" class="w-full flex-col gap-6 hidden w-full">
            
            <!-- Connection Header -->
            <div class="glass-panel p-4 rounded-2xl flex items-center justify-between slide-up">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full slide-up" style="animation-delay: 0.1s;">

                    <button onclick="document.getElementById('file-input').click()" class="bg-white text-zinc-900 hover:bg-zinc-200 hover:shadow-[0_0_20px_rgba(255,255,255,0.3)] px-8 py-3 rounded-xl font-bold transition-all duration-300">
                        Select Files

                <!-- Received Files Area -->

        </div>
    </main>

    <div id="toast-container"></div>

    <script>
        // --- Configuration & State ---
        // 256KB chunks perform exceptionally well for WebRTC data channels on local networks
        const CHUNK_SIZE = 256 * 1024; 
        
        let peer = null;
        let conn = null;
        let myPin = '';
        let wakeLock = null;
        
        // Batch Transfer State
        let fileQueue = [];
        let isTransferring = false;
        
        // Single Transfer State
        let transferState = {
            role: null,
            file: null,
            offset: 0,
            reader: null,
            receivedBuffers: [],
            receivedBytes: 0,
            meta: null
        };

        // --- Screen Wake Lock API ---
        async function requestWakeLock() {
            if ('wakeLock' in navigator && !wakeLock) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                    console.log('Screen Wake Lock acquired');
                } catch (err) {
                    console.error('Wake Lock error:', err);
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        // --- Utility Functions ---
        function generatePIN() {
            return Math.floor(10000 + Math.random() * 90000).toString();
        }

        function formatBytes(bytes) {
            if (!+bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(1))} ${sizes[i]}`;
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'heic'].includes(ext)) return 'ph-image text-purple-400';
            if (['mp4', 'mov', 'avi', 'mkv', 'webm'].includes(ext)) return 'ph-video-camera text-red-400';
            if (['mp3', 'wav', 'ogg', 'm4a'].includes(ext)) return 'ph-music-notes text-yellow-400';
            if (['pdf', 'doc', 'docx', 'txt'].includes(ext)) return 'ph-file-text text-blue-400';
            if (['zip', 'rar', 'tar', 'gz'].includes(ext)) return 'ph-file-archive text-orange-400';
            return 'ph-file text-zinc-400';
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            let icon = '<i class="ph-fill ph-info text-blue-400 text-xl"></i>';
            if (type === 'error') icon = '<i class="ph-fill ph-warning-circle text-red-400 text-xl"></i>';
            if (type === 'success') icon = '<i class="ph-fill ph-check-circle text-green-400 text-xl"></i>';

            toast.innerHTML = `
                <div class="flex items-center gap-3">
                    ${icon}
                    <span class="font-medium text-sm">${message}</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-zinc-500 hover:text-white transition-colors">
                    <i class="ph-bold ph-x"></i>
                </button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function updateAppStatus(status, text) {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            const connectBtn = document.getElementById('connect-btn');
            
            txt.innerText = text;
            dot.className = 'w-2 h-2 rounded-full shadow-lg ' + 
                (status === 'online' ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]' :
                 status === 'connected' ? 'bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.6)]' :
                 status === 'error' ? 'bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.6)]' : 'bg-yellow-500 animate-pulse shadow-[0_0_8px_rgba(234,179,8,0.6)]');

            if(connectBtn) connectBtn.disabled = status !== 'online';
        }

        // --- Core WebRTC Initialization ---
        function initApp() {
            myPin = generatePIN();
            document.getElementById('my-id-display').innerText = myPin;

            const connectUrl = `${window.location.origin}${window.location.pathname}?c=${myPin}`;
            document.getElementById('qr-container').classList.remove('hidden');
            new QRCode(document.getElementById("qrcode"), {
                text: connectUrl, width: 160, height: 160,
                colorDark : "#09090b", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.M
            });

            peer = new Peer(myPin, {
                debug: 2,
                config: {
                    'iceServers': [
                        { url: 'stun:stun.l.google.com:19302' },
                        { url: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                updateAppStatus('online', 'Ready to connect');
                checkUrlForAutoConnect();
            });

            peer.on('connection', (connection) => {
                if (conn && conn.open) {
                    connection.close();
                    return;
                }
                setupConnectionHandlers(connection);
            });

            peer.on('disconnected', () => {
                if (peer && !peer.destroyed) peer.reconnect();
            });

            peer.on('error', (err) => {
                if (err.type === 'peer-unavailable') {
                    showToast('Device PIN not found or offline.', 'error');
                } else if (err.type === 'network') {
                    updateAppStatus('error', 'Network Error');
                    showToast('Signaling server blocked. Try a different network.', 'error');
                } else {
                    updateAppStatus('error', 'Connection Failed');
                }
            });
            
            setupDragAndDrop();
        }

        function checkUrlForAutoConnect() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetPin = urlParams.get('c');
            if (targetPin && targetPin !== myPin) {
                document.getElementById('target-id-input').value = targetPin;
                initiateConnection();
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        function copyInviteLink() {
            const url = `${window.location.origin}${window.location.pathname}?c=${myPin}`;
            navigator.clipboard.writeText(url).then(() => {
                showToast('Invite link copied!', 'success');
            });
        }

        // --- Connection Management ---
        function initiateConnection() {
            const targetPin = document.getElementById('target-id-input').value.trim();
            if (!targetPin || targetPin === myPin || targetPin.length !== 5) {
                showToast('Enter a valid 5-digit remote PIN.', 'error');
                return;
            }
            
            updateAppStatus('connecting', 'Connecting...');
            const connection = peer.connect(targetPin, { reliable: true });
            setupConnectionHandlers(connection);
        }

        function setupConnectionHandlers(connection) {
            conn = connection;
            
            conn.on('open', () => {
                showToast('Connected securely!', 'success');
                updateAppStatus('connected', 'Connected');
                
                document.getElementById('setup-view').classList.add('hidden');
                document.getElementById('setup-view').classList.remove('flex');
                
                const activeView = document.getElementById('active-view');
                activeView.classList.remove('hidden');
                activeView.classList.add('flex', 'fade-in');
                document.getElementById('connected-id-display').innerText = conn.peer;
            });

            conn.on('data', handleIncomingData);

            conn.on('close', handleDisconnect);
            conn.on('error', () => {
                showToast('Connection error.', 'error');
                handleDisconnect();
            });
        }

        function disconnect() {
            if (conn) conn.close();
            handleDisconnect();
        }

        function handleDisconnect() {
            conn = null;
            isTransferring = false;
            fileQueue = [];
            releaseWakeLock();
            
            document.getElementById('transfer-overlay').classList.add('hidden');
            
            updateAppStatus('online', 'Ready to connect');
            
            document.getElementById('active-view').classList.add('hidden');
            document.getElementById('active-view').classList.remove('flex', 'fade-in');
            
            const setupView = document.getElementById('setup-view');
            setupView.classList.remove('hidden');
            setupView.classList.add('flex', 'fade-in');
            
            document.getElementById('target-id-input').value = '';
            showToast('Device disconnected.', 'info');
        }

        // --- Batch & File Transfer Logic ---
        function handleFileSelect(e) {
            if (e.target.files.length > 0) {
                enqueueFiles(Array.from(e.target.files));
            }
            e.target.value = '';
        }

        function enqueueFiles(files) {
            fileQueue.push(...files);
            if (!isTransferring) {
                processNextFile();
            } else {
                updateQueueUI();
            }
        }

        function processNextFile() {
            if (fileQueue.length === 0) {
                isTransferring = false;
                releaseWakeLock();
                document.getElementById('transfer-overlay').classList.add('hidden');
                return;
            }

            isTransferring = true;
            requestWakeLock();
            const file = fileQueue.shift();
            
            transferState = {
                role: 'sender',
                file: file,
                offset: 0,
                reader: new FileReader()
            };

            showTransferUI('sender', file.name);
            updateQueueUI();

            conn.send(JSON.stringify({
                type: 'meta',
                name: file.name,
                size: file.size,
                mime: file.type
            }));
        }

        function sendNextChunk() {
            const state = transferState;
            if (state.offset >= state.file.size) {
                conn.send(JSON.stringify({ type: 'eof' }));
                return; // Wait for receiver ack before processing next file
            }

            const slice = state.file.slice(state.offset, state.offset + CHUNK_SIZE);
            state.reader.onload = (e) => {
                conn.send(e.target.result); 
                state.offset += slice.size;
                updateTransferProgress(state.offset, state.file.size);
            };
            state.reader.readAsArrayBuffer(slice);
        }

        function handleIncomingData(data) {
            if (typeof data === 'string') {
                const msg = JSON.parse(data);
                
                if (msg.type === 'meta') {
                    requestWakeLock();
                    transferState = {
                        role: 'receiver',
                        receivedBuffers: [],
                        receivedBytes: 0,
                        meta: msg
                    };
                    showTransferUI('receiver', msg.name);
                    conn.send(JSON.stringify({ type: 'ack' })); 
                
                } else if (msg.type === 'ack') {
                    sendNextChunk();
                
                } else if (msg.type === 'eof') {
                    assembleAndDownloadReceivedFile();
                    // Tell sender we finished saving
                    conn.send(JSON.stringify({ type: 'file_saved' })); 
                
                } else if (msg.type === 'file_saved') {
                    // Receiver finished saving, start next file in queue
                    updateTransferProgress(1, 1);
                    setTimeout(processNextFile, 500);
                }
            } else {
                const state = transferState;
                if (!state.meta) return;

                state.receivedBuffers.push(data);
                state.receivedBytes += data.byteLength;
                updateTransferProgress(state.receivedBytes, state.meta.size);
                
                conn.send(JSON.stringify({ type: 'ack' }));
            }
        }

        function assembleAndDownloadReceivedFile() {
            const state = transferState;
            const blob = new Blob(state.receivedBuffers, { type: state.meta.mime });
            
            addFileToHistory(blob, state.meta.name, state.meta.size);
            showToast(`Received: ${state.meta.name}`, 'success');
            updateTransferProgress(1, 1);
            
            setTimeout(() => {
                document.getElementById('transfer-overlay').classList.add('hidden');
                releaseWakeLock();
            }, 1000);
        }

        // --- UI Updates ---
        function showTransferUI(role, filename) {
            const overlay = document.getElementById('transfer-overlay');
            const title = document.getElementById('transfer-title');
            const icon = document.getElementById('transfer-icon');
            const nameEl = document.getElementById('transfer-filename');
            
            overlay.classList.remove('hidden');
            nameEl.innerText = filename;
            
            if (role === 'sender') {
                title.innerText = 'Sending File';
                icon.className = 'ph-fill ph-upload-simple text-5xl text-blue-500 animate-bounce';
            } else {
                title.innerText = 'Receiving File';
                icon.className = 'ph-fill ph-download-simple text-5xl text-purple-500 animate-bounce';
            }
            updateTransferProgress(0, 1);
        }

        function updateQueueUI() {
            const qStatus = document.getElementById('queue-status');
            if (fileQueue.length > 0) {
                qStatus.classList.remove('hidden');
                qStatus.innerText = `Queue: ${fileQueue.length} remaining`;
            } else {
                qStatus.classList.add('hidden');
            }
        }

        function updateTransferProgress(current, total) {
            const percent = total > 0 ? Math.min(100, Math.round((current / total) * 100)) : 0;
            document.getElementById('transfer-percent').innerText = `${percent}%`;
            document.getElementById('transfer-progress-bar').style.width = `${percent}%`;
            
            const bar = document.getElementById('transfer-progress-bar');
            if (percent === 100) {
                bar.classList.replace('from-blue-500', 'from-green-500');
                bar.classList.replace('to-cyan-400', 'to-emerald-400');
            } else {
                bar.classList.replace('from-green-500', 'from-blue-500');
                bar.classList.replace('to-emerald-400', 'to-cyan-400');
            }
        }

        function addFileToHistory(blob, filename, size) {
            const list = document.getElementById('received-list');
            const empty = document.getElementById('empty-received');
            const count = document.getElementById('received-count');
            
            if (empty) empty.remove();

            const url = URL.createObjectURL(blob);
            const item = document.createElement('div');
            item.className = 'bg-white/5 border border-white/10 p-3 rounded-xl flex items-center justify-between group hover:bg-white/10 transition-colors fade-in';
            
            item.innerHTML = `
                <div class="flex items-center gap-4 overflow-hidden">
                    <div class="bg-black/20 p-2.5 rounded-lg shrink-0 border border-white/5">
                        <i class="ph-fill ${getFileIcon(filename)} text-2xl"></i>
                    </div>
                    <div class="truncate">
                        <p class="text-white font-medium text-sm truncate mb-0.5" title="${filename}">${filename}</p>
                        <p class="text-zinc-500 text-xs">${formatBytes(size)}</p>
                    </div>
                </div>
                <a href="${url}" download="${filename}" class="shrink-0 p-2 bg-blue-500/20 text-blue-400 hover:bg-blue-500 hover:text-white rounded-lg transition-colors ml-2" title="Save File">
                    <i class="ph-bold ph-download-simple text-lg"></i>
                </a>
            `;
            list.insertBefore(item, list.firstChild);
            count.innerText = parseInt(count.innerText) + 1;

            // Auto-trigger download
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // --- Drag and Drop Setup ---
        function setupDragAndDrop() {
            const dropZone = document.getElementById('drop-zone');
            if (!dropZone) return;

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault(); e.stopPropagation();
                }, false);
            });

            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => {
                    if (conn && conn.open) dropZone.classList.add('drag-active');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => {
                    dropZone.classList.remove('drag-active');
                }, false);
            });

            dropZone.addEventListener('drop', (e) => {
                if (conn && conn.open && e.dataTransfer.files.length > 0) {
                    enqueueFiles(Array.from(e.dataTransfer.files));
                }
            }, false);
            
            document.body.addEventListener('dragover', (e) => e.preventDefault());
            document.body.addEventListener('drop', (e) => e.preventDefault());
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
